<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;overflow:hidden;background:#fff;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111}
.status{height:96px;display:flex;justify-content:space-between;align-items:center;padding:22px 70px 0;font-size:38px;font-weight:600}
.bat{display:inline-block;width:60px;height:28px;border:3px solid #111;border-radius:8px;position:relative;vertical-align:middle}.bat:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:16px;background:#e03a2f;border-radius:3px}
.head{display:flex;flex-direction:column;align-items:center;padding:4px 0 12px;border-bottom:1px solid #e5e5ea;background:#f9f9f9;position:relative}
.back{position:absolute;left:40px;top:40px;color:#0a7cff;font-size:56px}
.av{width:80px;height:80px;border-radius:50%;background:#a7adb7;color:#fff;display:flex;align-items:center;justify-content:center;font-size:52px}
.name{font-size:30px;margin-top:8px}
.chat{padding:8px 34px;display:flex;flex-direction:column;gap:9px}
.m{max-width:74%;padding:15px 28px;border-radius:36px;font-size:33px;line-height:1.22}
.them{align-self:flex-start;background:#e9e9eb}.me{align-self:flex-end;background:#0a7cff;color:#fff}
.time{align-self:center;font-size:24px;color:#8e8e93;margin:6px 0}
.photo{align-self:flex-start;width:290px;height:220px;border-radius:34px;overflow:hidden;position:relative;background:#c98f7e}
.photo i{position:absolute;inset:-40px;background:radial-gradient(circle at 60% 55%,#f0b9a3 0 18%,#d99883 38%,#a8645a 62%,#4a2a28 85%);filter:blur(14px)}
.photo b{position:absolute;right:16px;top:18px;width:110px;height:70px;background:#fff;opacity:.55;filter:blur(18px);border-radius:50%}
.typing{align-self:flex-start;background:#e9e9eb;border-radius:36px;padding:18px 28px;display:flex;gap:10px}.typing span{width:16px;height:16px;border-radius:50%;background:#9a9aa0}
</style></head><body>
<div class="status"><span>10:47</span><span>●●○○ 4G <span class="bat"></span></span></div>
<div class="head"><span class="back">‹</span><div class="av">?</div><div class="name">07700 900982 ›</div></div>
<div class="chat">
<div class="time">Today 10:31</div>
<div class="m them">Hi is that the plumber. Water coming out the pipey bit under the sink</div>
<div class="m me">Is it the trap or the tap feed?</div>
<div class="m them">The wet one</div>
<div class="m me">Can you send me a photo?</div>
<div class="photo"><i></i><b></b></div>
<div class="m them">Thats the cupboard</div>
<div class="m me">Whereabouts are you?</div>
<div class="m them">Near the church</div>
<div class="m me">Which church?</div>
<div class="m them">The big one 👍</div>
<div class="typing"><span></span><span></span><span></span></div>
</div></body></html>
